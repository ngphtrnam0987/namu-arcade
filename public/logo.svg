<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="#0B0E17" stroke="url(#logo-grad)" stroke-width="3"/>
  <!-- Planet Orbit Ring -->
  <ellipse cx="60" cy="60" rx="46" ry="18" fill="none" stroke="#00F0FF" stroke-width="2" transform="rotate(-25 60 60)" opacity="0.6"/>
  <!-- Gamepad / Arcade D-Pad & Core -->
  <circle cx="60" cy="60" r="26" fill="#131B2E" stroke="#A855F7" stroke-width="2.5" filter="url(#logo-glow)"/>
  <!-- Star Accent -->
  <polygon points="60,42 63,55 76,60 63,65 60,78 57,65 44,60 57,55" fill="url(#logo-grad)"/>
  <circle cx="60" cy="60" r="4" fill="#FFFFFF"/>
</svg>
